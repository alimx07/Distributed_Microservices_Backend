apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-service
  namespace: dmb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: feed-service
  template:
    metadata:
      labels:
        app: feed-service
    spec:
      containers:
        - name: feed-service
          image: alimx07/feed_service:f3db6b7fbea722f51797067be575d2cf1c864a9f
