apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: dmb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: alimx07/user_service
