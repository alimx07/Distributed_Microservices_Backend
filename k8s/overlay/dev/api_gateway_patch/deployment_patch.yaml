apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: dmb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: alimx07/api_gateway