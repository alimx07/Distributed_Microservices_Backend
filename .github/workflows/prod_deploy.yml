name: Deploy to Prod enviroment

# Current Assumptions:
# We deploy first to Dev env
# If we are good, Deploy to Prod with manual gate approve
# We will verify the rollout for just pipeline correctness purpose / Alert
# k8s rollout strategy will handle zero downtime if new pods crashes
# If we need rollback : revert + ArgoCD / ArgoCD UI + sync
# Naive stratiges untill now

on:
  push:
    tags:
      - 'v*'

jobs:
  detect:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify tag on main branch
        run: |
           git branch -r --contains ${{ github.sha }} | grep -q "origin/main" || \
           (echo "Tag is not on main branch" && exit 1)

      - id: detect
        # EdgeCase: What if this is first Tag (Handled)
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          SERVICES=()
          for svc in api_gateway post_service feed_service user_service follow_service; do
            if [ -z "$PREV_TAG" ]; then
              SERVICES+=("$svc")
            elif git diff --name-only $PREV_TAG ${{ github.sha }} | grep -q "^services/${svc}/"; then
              SERVICES+=("$svc")
            fi
          done
          MATRIX=$(printf '%s\n' "${SERVICES[@]}" | jq -R . | jq -sc .)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  update_manifests:
    needs: [detect]
    runs-on: ubuntu-latest
    environment: Production
    if: needs.detect.outputs.matrix != '[""]'
    permissions:
      contents: write
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: |
            k8s/overlay/prod/${{ matrix.service }}_patch
            
      - name : Login Docker
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.username }}
          password: ${{ inputs.password }}

      - name: Retag and push latest
        run: |
          docker pull alimx07/${{ matrix.service }}:${{ github.sha }}
          docker tag alimx07/${{ matrix.service }}:${{ github.sha }} alimx07/${{ matrix.service }}:latest
          docker push alimx07/${{ matrix.service }}:latest

      - uses: ./.github/actions/commit-manifest
        with:
          service: ${{ matrix.service }}
          sha: ${{ github.sha }}
          overlay: prod
          commit_message: "Release: update ${{ matrix.service }} to ${{ github.sha }} (tag: ${{ github.ref_name }})"

  verify_rollout:
    name: Verify Rollout in Cluster
    needs: [update_manifests]
    runs-on: ubuntu-latest
    steps:
      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Wait for ArgoCD sync and health
        run: |
          argocd app wait dmb-prod \
            --sync \
            --health \
            --timeout 600
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_OPTS: "--grpc-web"
